name: Deploy optimized portfolio

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "scripts/prepare-portfolio.py"
      - "scripts/optimize-media.py"
      - "assets/media.js"
      - "assets/wind.js"
      - "assets/guestbook-project.svg"
      - "assets/guestbook/**"
      - "assets/local-media/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment helpers
        uses: actions/checkout@v4

      - name: Download the landing page and portfolio
        shell: bash
        run: |
          mkdir -p site
          wget --page-requisites --convert-links --adjust-extension --no-host-directories --directory-prefix site \
            https://rui-portfolio-2026.liaosirui3.chatgpt.site/ \
            https://rui-portfolio-2026.liaosirui3.chatgpt.site/index2 \
            https://rui-portfolio-2026.liaosirui3.chatgpt.site/guestbook/ || true
          mkdir -p site/js
          wget -q -O site/js/three.module.js https://rui-portfolio-2026.liaosirui3.chatgpt.site/js/three.module.js
          test -s site/js/three.module.js
          test -f site/index.html
          test -f site/index2.html
          mkdir -p site/projects
          cp site/index2.html site/projects/index.html
          perl -pi -e 's#<head>#<head>\n    <base href="/">#' site/projects/index.html
          perl -pi -e 's|\Qhttps://rui-portfolio-2026.liaosirui3.chatgpt.site/index2.html\E|projects/|g' site/index.html
          printf 'liaosirui.online\n' > site/CNAME
          touch site/.nojekyll

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil ffmpeg

      - name: Restore local portfolio media
        run: cp -R assets/local-media/. site/

      - name: Optimize HD images and animations
        run: python3 scripts/optimize-media.py site

      - name: Prepare fast media and canonical navigation
        run: |
          cp assets/media.js site/media.js
          cp assets/wind.js site/wind.js
          cp assets/guestbook-project.svg site/guestbook-project.svg
          python3 scripts/prepare-portfolio.py site
          test -f site/design/index.html
          mkdir -p site/guestbook
          cp -R assets/guestbook/. site/guestbook/
          test -f site/guestbook/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
