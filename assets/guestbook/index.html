<!doctype html>
<html lang="en"><head>
<meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8">
<title>leave me a note</title>
<link rel="canonical" href="https://liaosirui.online/guestbook/">
<link rel="icon" type="image/webp" href="/favicon.png.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
<link href="guest.css?v=original-design-1" rel="stylesheet">
<script src="guest.js?v=original-design-1" defer></script>
</head><body>
<header><nav><ul><li>leave a note ~｡:*</li><li id="time">time</li><li><a href="/">back</a></li></ul></nav></header>
<div class="guestbook" id="guestbook"><div id="notes" aria-label="Guestbook notes"></div></div>
<form id="guest-form" method="post">
<input id="name" type="text" name="xinming" aria-label="your name" maxlength="60" autocomplete="name" required>
<textarea id="message" name="liuyan" aria-label="your note" maxlength="1000" required></textarea>
<div class="trap" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off" aria-label="website"></div>
<div class="submit"><span id="question">…</span> = <input id="answer" name="math" inputmode="numeric" aria-label="answer to the sum" autocomplete="off" required> <button type="submit" disabled>Send</button></div>
<p id="status" role="status" aria-live="polite"></p>
</form>
<button id="more" type="button" hidden>more</button>
<p class="credits">original php by &nbsp;<a href="https://github.com/taufik-nurrohman/flat-file-guestbook">Taufik Nurrohman</a>&nbsp; and inspired by my good friend &nbsp;<a href="https://ericko.info">eric.</a></p>
</body></html>
